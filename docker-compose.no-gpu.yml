# For hosts without an Intel GPU (/dev/dri): Linux without Intel graphics, or
# Docker Desktop on Windows/macOS. Encoding then runs on the CPU (x264/x265...).
# Enable it in .env (on Windows use ";" instead of ":" between the files):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.no-gpu.yml
services:
  encforge:
    devices: !reset []
    group_add: !override
      - "${MEDIA_GID:-100}"
